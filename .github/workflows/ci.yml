name: versionlib-ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  posix:
    name: versionlib POSIX
    runs-on: ubuntu-latest
    steps:
      - name: Check out versionlib
        uses: actions/checkout@v7
        with:
          path: versionlib
      - name: Check out sibling crates (transitive pin closure)
        # Derived from the alire.toml pins themselves, and it carries the i18n
        # upstream download cache: a hand-listed set goes stale the moment the
        # graph gains a crate (it last missed ssllib and truststores, and the
        # build died on the pin rather than the code).
        uses: bracke/project_tools/.github/actions/checkout-ada-siblings@main
        with:
          root: versionlib
      - name: Align sibling branches with this one where they exist
        # versionlib and the crates it pins change together, so a feature
        # branch here must build against the same branch there -- the siblings
        # are cloned at their default branch, which does not carry work this
        # branch depends on.
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
          [ -n "$branch" ] || exit 0
          # $PWD, not $GITHUB_WORKSPACE: on the Windows runner the latter is a
          # backslash path whose separators bash would eat as escapes when the
          # glob below expands. The step starts in the workspace root either way.
          for dir in "$PWD"/*/; do
            name=$(basename "$dir")
            [ "$name" = versionlib ] && continue
            [ -d "$dir/.git" ] || continue
            git -C "$dir" ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1 || continue
            git -C "$dir" fetch -q --depth 1 origin "$branch"
            git -C "$dir" checkout -q FETCH_HEAD
            echo "aligned $name to $branch"
          done
      - name: Set up Alire
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild

      - name: Raise Alire solver timeout so slow runners get a complete solution
        # Default solver.timeout is 5 s (+10 s grace); a large graph on a slow
        # runner can time out and ship an INCOMPLETE solution, silently dropping
        # transitive crates (then gprbuild fails with "<x>.gpr not found").
        shell: bash
        run: alr settings --global --set solver.timeout 600
      - name: Build versionlib verification tooling
        working-directory: versionlib/tools
        run: alr --non-interactive build
      - name: Generate tests-crate config
        working-directory: versionlib/tests
        run: alr --non-interactive build
      - name: Run versionlib release preflight
        working-directory: versionlib
        run: ./tools/bin/check_release_ready

  windows:
    name: versionlib Windows
    runs-on: windows-latest
    steps:
      - name: Check out versionlib
        uses: actions/checkout@v7
        with:
          path: versionlib
      - name: Check out sibling crates (transitive pin closure)
        # Derived from the alire.toml pins themselves, and it carries the i18n
        # upstream download cache: a hand-listed set goes stale the moment the
        # graph gains a crate (it last missed ssllib and truststores, and the
        # build died on the pin rather than the code).
        uses: bracke/project_tools/.github/actions/checkout-ada-siblings@main
        with:
          root: versionlib
      - name: Align sibling branches with this one where they exist
        # versionlib and the crates it pins change together, so a feature
        # branch here must build against the same branch there -- the siblings
        # are cloned at their default branch, which does not carry work this
        # branch depends on.
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
          [ -n "$branch" ] || exit 0
          # $PWD, not $GITHUB_WORKSPACE: on the Windows runner the latter is a
          # backslash path whose separators bash would eat as escapes when the
          # glob below expands. The step starts in the workspace root either way.
          for dir in "$PWD"/*/; do
            name=$(basename "$dir")
            [ "$name" = versionlib ] && continue
            [ -d "$dir/.git" ] || continue
            git -C "$dir" ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1 || continue
            git -C "$dir" fetch -q --depth 1 origin "$branch"
            git -C "$dir" checkout -q FETCH_HEAD
            echo "aligned $name to $branch"
          done
      - name: Set up Alire
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild

      - name: Raise Alire solver timeout so slow runners get a complete solution
        # Default solver.timeout is 5 s (+10 s grace); a large graph on a slow
        # runner can time out and ship an INCOMPLETE solution, silently dropping
        # transitive crates (then gprbuild fails with "<x>.gpr not found").
        shell: bash
        run: alr settings --global --set solver.timeout 600
      - name: Build library
        working-directory: versionlib
        shell: bash
        run: alr --non-interactive build
      - name: Build the AUnit suite
        working-directory: versionlib/tests
        shell: bash
        # Building this graph on a Windows runner is slow but bounded; time
        # it separately from the run so a timeout says which one stalled.
        timeout-minutes: 75
        run: alr --non-interactive build

      - name: Run the AUnit suite
        working-directory: versionlib
        shell: bash
        timeout-minutes: 45
        env:
          # A merge fixture runs `git commit` without -m: with no editor
          # configured git opens one and blocks on stdin, which on a runner is
          # a hung job rather than a failure.
          GIT_EDITOR: "true"
          EDITOR: "true"
        run: |
          if [ -f ./tests/bin/tests.exe ]; then ./tests/bin/tests.exe; else ./tests/bin/tests; fi

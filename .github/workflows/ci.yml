name: versionlib-ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  posix:
    name: versionlib POSIX
    runs-on: ubuntu-latest
    steps:
      - name: Check out versionlib
        uses: actions/checkout@v7
        with:
          path: versionlib
      - name: Check out httpclient sibling
        uses: actions/checkout@v7
        with: { repository: "${{ github.repository_owner }}/httpclient", path: httpclient }
      - name: Check out project_tools sibling
        uses: actions/checkout@v7
        with: { repository: "${{ github.repository_owner }}/project_tools", path: project_tools }
      - name: Check out zlib sibling
        uses: actions/checkout@v7
        with: { repository: "${{ github.repository_owner }}/zlib", path: zlib }
      - name: Check out cryptolib sibling
        uses: actions/checkout@v7
        with: { repository: "${{ github.repository_owner }}/cryptolib", path: cryptolib }
      - name: Check out regexp sibling
        uses: actions/checkout@v7
        with: { repository: "${{ github.repository_owner }}/regexp", path: regexp }
      - name: Check out i18n sibling
        uses: actions/checkout@v7
        with: { repository: "${{ github.repository_owner }}/i18n", path: i18n }
      - name: Check out sshlib sibling
        uses: actions/checkout@v7
        with: { repository: "${{ github.repository_owner }}/sshlib", path: sshlib }
      - name: Check out hostkit sibling
        uses: actions/checkout@v7
        with: { repository: "${{ github.repository_owner }}/hostkit", path: hostkit }
      - name: Compute an OS-stable i18n upstream cache key
        id: cldr_key
        if: hashFiles('i18n/cldr/upstream/source_manifest.txt') != ''
        shell: bash
        run: |
          set -euo pipefail
          # i18n's regen fetches three flaky sources -- cldr-json (GitHub), tzdb
          # (IANA) and the Unicode UCD/UCA/collation/transforms -- each of which
          # reaches the Windows runner only intermittently. The next step caches
          # all of them. Versions are pinned in the tracked cldr manifest plus
          # hardcoded constants in the three downloader sources, so hash all four:
          # any version/logic change busts the cache. Strip CR so the key is
          # identical on every OS (git checks these out CRLF on Windows, LF else).
          h=$(cat \
                "$GITHUB_WORKSPACE/i18n/cldr/upstream/source_manifest.txt" \
                "$GITHUB_WORKSPACE/i18n/cldr/src/download_cldr_upstream.adb" \
                "$GITHUB_WORKSPACE/i18n/cldr/src/download_tzdb.adb" \
                "$GITHUB_WORKSPACE/i18n/cldr/src/fetch_ucd.adb" \
              | tr -d '\r' | git hash-object --stdin)
          echo "key=i18n-upstream-$h" >> "$GITHUB_OUTPUT"
      - name: Cache the i18n upstream download trees (CI-only; avoids flaky 82 MB+ downloads)
        # Only the raw download trees are cached (not the generated export), so the
        # regen re-runs with current i18n code; each downloader skips when its dir
        # is present. The reliable posix job seeds one shared cross-OS entry the
        # windows job restores, taking Windows out of the download path. Inlined
        # because versionlib checks out siblings by hand, not via project_tools'
        # checkout-ada-siblings action.
        if: steps.cldr_key.outputs.key != ''
        uses: actions/cache@v4
        with:
          path: |
            i18n/cldr/upstream/cldr-json
            i18n/cldr/upstream/tzdb
            i18n/cldr/upstream/ucd
            i18n/cldr/upstream/ucd16
            i18n/cldr/upstream/uca
            i18n/cldr/upstream/collation
            i18n/cldr/upstream/transforms
            i18n/cldr/upstream/transforms_test
          key: ${{ steps.cldr_key.outputs.key }}
          enableCrossOsArchive: true
      - name: Set up Alire
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild
      - name: Install OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Build versionlib verification tooling
        working-directory: versionlib/tools
        run: alr --non-interactive build
      - name: Generate tests-crate config
        working-directory: versionlib/tests
        run: alr --non-interactive build
      - name: Run versionlib release preflight
        working-directory: versionlib
        run: ./tools/bin/check_release_ready

  windows:
    name: versionlib Windows
    runs-on: windows-latest
    steps:
      - name: Check out versionlib
        uses: actions/checkout@v7
        with:
          path: versionlib
      - name: Check out httpclient sibling
        uses: actions/checkout@v7
        with: { repository: "${{ github.repository_owner }}/httpclient", path: httpclient }
      - name: Check out project_tools sibling
        uses: actions/checkout@v7
        with: { repository: "${{ github.repository_owner }}/project_tools", path: project_tools }
      - name: Check out zlib sibling
        uses: actions/checkout@v7
        with: { repository: "${{ github.repository_owner }}/zlib", path: zlib }
      - name: Check out cryptolib sibling
        uses: actions/checkout@v7
        with: { repository: "${{ github.repository_owner }}/cryptolib", path: cryptolib }
      - name: Check out regexp sibling
        uses: actions/checkout@v7
        with: { repository: "${{ github.repository_owner }}/regexp", path: regexp }
      - name: Check out i18n sibling
        uses: actions/checkout@v7
        with: { repository: "${{ github.repository_owner }}/i18n", path: i18n }
      - name: Check out sshlib sibling
        uses: actions/checkout@v7
        with: { repository: "${{ github.repository_owner }}/sshlib", path: sshlib }
      - name: Check out hostkit sibling
        uses: actions/checkout@v7
        with: { repository: "${{ github.repository_owner }}/hostkit", path: hostkit }
      - name: Compute an OS-stable i18n upstream cache key
        id: cldr_key
        if: hashFiles('i18n/cldr/upstream/source_manifest.txt') != ''
        shell: bash
        run: |
          set -euo pipefail
          # i18n's regen fetches three flaky sources -- cldr-json (GitHub), tzdb
          # (IANA) and the Unicode UCD/UCA/collation/transforms -- each of which
          # reaches the Windows runner only intermittently. The next step caches
          # all of them. Versions are pinned in the tracked cldr manifest plus
          # hardcoded constants in the three downloader sources, so hash all four:
          # any version/logic change busts the cache. Strip CR so the key is
          # identical on every OS (git checks these out CRLF on Windows, LF else).
          h=$(cat \
                "$GITHUB_WORKSPACE/i18n/cldr/upstream/source_manifest.txt" \
                "$GITHUB_WORKSPACE/i18n/cldr/src/download_cldr_upstream.adb" \
                "$GITHUB_WORKSPACE/i18n/cldr/src/download_tzdb.adb" \
                "$GITHUB_WORKSPACE/i18n/cldr/src/fetch_ucd.adb" \
              | tr -d '\r' | git hash-object --stdin)
          echo "key=i18n-upstream-$h" >> "$GITHUB_OUTPUT"
      - name: Cache the i18n upstream download trees (CI-only; avoids flaky 82 MB+ downloads)
        # Only the raw download trees are cached (not the generated export), so the
        # regen re-runs with current i18n code; each downloader skips when its dir
        # is present. The reliable posix job seeds one shared cross-OS entry the
        # windows job restores, taking Windows out of the download path. Inlined
        # because versionlib checks out siblings by hand, not via project_tools'
        # checkout-ada-siblings action.
        if: steps.cldr_key.outputs.key != ''
        uses: actions/cache@v4
        with:
          path: |
            i18n/cldr/upstream/cldr-json
            i18n/cldr/upstream/tzdb
            i18n/cldr/upstream/ucd
            i18n/cldr/upstream/ucd16
            i18n/cldr/upstream/uca
            i18n/cldr/upstream/collation
            i18n/cldr/upstream/transforms
            i18n/cldr/upstream/transforms_test
          key: ${{ steps.cldr_key.outputs.key }}
          enableCrossOsArchive: true
      - name: Set up Alire
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild
      - name: Build library
        working-directory: versionlib
        shell: bash
        run: alr --non-interactive build
      - name: Build and run the AUnit suite
        working-directory: versionlib
        shell: bash
        run: |
          (cd tests && alr --non-interactive build)
          if [ -f ./tests/bin/tests.exe ]; then ./tests/bin/tests.exe; else ./tests/bin/tests; fi
